name: Build Base Image

# 构建并推送 PXB 编译环境基础镜像(多架构)到 ACR
# 触发:手动。参数:glib_version(决定用哪个 Dockerfile + 目标 tag)、architecture(可选单架构调试)。
#
# 结构(arm64 用原生 runner,不走 QEMU):
#   build-amd64    - ubuntu-latest(原生 amd64),推 base-glib-X-amd64
#   build-arm64    - ubuntu-24.04-arm(原生 arm64,免费),推 base-glib-X-arm64
#   merge-manifest - 仅 architecture=all,合并两个单架构 tag 为多架构 tag
#
# 注意:不使用 matrix + runs-on: ${{ matrix.runner }}。实测该写法触发 startup_failure
# (GitHub 启动阶段无法可靠解析动态 runner label)。故拆成两个独立 job,runs-on 用静态字符串。

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      glib_version:
        description: 'glibc 版本(决定用哪个基础镜像 Dockerfile)'
        required: true
        type: choice
        options:
          - '2.28'
          - '2.17'
        default: '2.28'
      architecture:
        description: '目标架构(all=amd64+arm64 并行,也可单架构调试)'
        required: true
        type: choice
        options:
          - all
          - amd64
          - arm64
        default: all

jobs:
  # ============================================================
  # amd64 构建(原生 amd64 runner)
  # ============================================================
  build-amd64:
    if: ${{ github.event.inputs.architecture == 'all' || github.event.inputs.architecture == 'amd64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup

      - name: Build and Push Base Image (amd64)
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ vars.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ vars.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          GLIB_VERSION="${{ github.event.inputs.glib_version }}"
          ARCH="amd64"
          ACR_URL="${ALIYUN_REGISTRY}"
          ACR_NS="${ALIYUN_NAME_SPACE}"
          TAG="xtrabackup:base-glib-${GLIB_VERSION}-${ARCH}"
          TARGET="${ACR_URL}/${ACR_NS}/${TAG}"

          echo "============================================"
          echo "  构建基础镜像(${ARCH}, 原生 runner)"
          echo "============================================"
          echo "  glibc 版本:  ${GLIB_VERSION}"
          echo "  Dockerfile:  base/Dockerfile-glib${GLIB_VERSION}"
          echo "  目标镜像:    ${TARGET}"
          echo "  平台:        linux/${ARCH}"
          echo "============================================"

          docker login -u "${ALIYUN_REGISTRY_USER}" -p "${ALIYUN_REGISTRY_PASSWORD}" "${ACR_URL}"

          docker buildx build \
            --platform "linux/${ARCH}" \
            -t "${TARGET}" \
            -f "base/Dockerfile-glib${GLIB_VERSION}" \
            --no-cache \
            --push \
            base/

          echo "✅ 单架构基础镜像构建推送成功: ${TARGET}"

      - name: Cleanup
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

  # ============================================================
  # arm64 构建(原生 arm64 runner,免费,不走 QEMU)
  # ============================================================
  build-arm64:
    if: ${{ github.event.inputs.architecture == 'all' || github.event.inputs.architecture == 'arm64' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup

      - name: Build and Push Base Image (arm64)
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ vars.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ vars.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          GLIB_VERSION="${{ github.event.inputs.glib_version }}"
          ARCH="arm64"
          ACR_URL="${ALIYUN_REGISTRY}"
          ACR_NS="${ALIYUN_NAME_SPACE}"
          TAG="xtrabackup:base-glib-${GLIB_VERSION}-${ARCH}"
          TARGET="${ACR_URL}/${ACR_NS}/${TAG}"

          echo "============================================"
          echo "  构建基础镜像(${ARCH}, 原生 runner)"
          echo "============================================"
          echo "  glibc 版本:  ${GLIB_VERSION}"
          echo "  Dockerfile:  base/Dockerfile-glib${GLIB_VERSION}"
          echo "  目标镜像:    ${TARGET}"
          echo "  平台:        linux/${ARCH}"
          echo "============================================"

          docker login -u "${ALIYUN_REGISTRY_USER}" -p "${ALIYUN_REGISTRY_PASSWORD}" "${ACR_URL}"

          docker buildx build \
            --platform "linux/${ARCH}" \
            -t "${TARGET}" \
            -f "base/Dockerfile-glib${GLIB_VERSION}" \
            --no-cache \
            --push \
            base/

          echo "✅ 单架构基础镜像构建推送成功: ${TARGET}"

      - name: Cleanup
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

  # ============================================================
  # 合并两个单架构 tag 为多架构 manifest(仅 architecture=all 时)
  # ============================================================
  merge-manifest:
    needs: [build-amd64, build-arm64]
    if: ${{ github.event.inputs.architecture == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge Multi-Arch Manifest
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ vars.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ vars.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          GLIB_VERSION="${{ github.event.inputs.glib_version }}"
          REPO="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}"
          MULTI_TAG="${REPO}/xtrabackup:base-glib-${GLIB_VERSION}"
          AMD64_TAG="${REPO}/xtrabackup:base-glib-${GLIB_VERSION}-amd64"
          ARM64_TAG="${REPO}/xtrabackup:base-glib-${GLIB_VERSION}-arm64"

          echo "============================================"
          echo "  合并多架构 manifest"
          echo "============================================"
          echo "  ${AMD64_TAG}"
          echo "  ${ARM64_TAG}"
          echo "  -> ${MULTI_TAG}"
          echo "============================================"

          docker login -u "${ALIYUN_REGISTRY_USER}" -p "${ALIYUN_REGISTRY_PASSWORD}" "${ALIYUN_REGISTRY}"

          # create 自动拉取两个单架构 manifest;若 MULTI_TAG 已存在则先删
          docker manifest rm "${MULTI_TAG}" 2>/dev/null || true
          docker manifest create "${MULTI_TAG}" "${AMD64_TAG}" "${ARM64_TAG}"
          docker manifest push "${MULTI_TAG}"

          echo "✅ 多架构基础镜像推送成功: ${MULTI_TAG}"

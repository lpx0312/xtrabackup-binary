name: Build Image

# 从已发布的 GitHub Release 拉取二进制 tarball,打包成 Docker 镜像并推送到 ACR。
# 职责单一:不做编译,二进制由 build-binary.yml 产出并发布到 Release。
#
# 入参:
#   PXB_VERSION   - PXB 完整版本号(如 8.0.35-36)。用于拼 Release tag + 镜像 tag
#   glib_version  - glibc 版本(2.28/2.17)。用于拼 Release tag + 选基础镜像
#   architecture  - all / amd64 / arm64(默认 all)。控制是否两个架构都构建
#
# 前置依赖(缺失会在对应步骤明确报错):
#   1. 目标 Release 已发布 —— build-binary.yml 用相同 PXB_VERSION + glib_version 跑过,
#      tag `v<PXB>-glib<glib>` 存在,挂有两架构 tarball
#   2. 基础镜像已推 ACR —— build-base-image.yml 推过 base-glib-<glib> 多架构 tag
#      (ci-build-image.sh 的 FROM 依赖它)
#
# 流程:
#   build-image (matrix: amd64, arm64)  →  merge-manifest (仅 architecture=all)
#     → 从 Release wget tarball 到 output/
#     → 复用 build/ci-build-image.sh 打镜像 + 推单架构 tag
#
# 镜像 tag 规则(与 build-binary 旧逻辑保持一致):
#   <ACR>/<NS>/xtrabackup:<PXB>-glib<glib>-amd64    ← build-image job 产出
#   <ACR>/<NS>/xtrabackup:<PXB>-glib<glib>-arm64    ← build-image job 产出
#   <ACR>/<NS>/xtrabackup:<PXB>-glib<glib>           ← merge-manifest 合并(不带架构后缀 = 多架构)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      PXB_VERSION:
        description: 'PXB 完整版本号(对应已发布的 Release tag v<PXB>-glib<glib>,如 8.0.35-36)'
        required: true
        default: '8.0.35-36'
        type: string
      glib_version:
        description: 'glibc 版本(决定 Release tag 后缀 + 用哪个基础镜像)'
        required: true
        type: choice
        options:
          - '2.28'
          - '2.17'
        default: '2.28'
      architecture:
        description: '目标架构(all=amd64+arm64 并行,也可单架构)'
        required: true
        type: choice
        options:
          - all
          - amd64
          - arm64
        default: all

jobs:
  # ============================================================
  # Job 1: 按架构矩阵并行,从 Release 下载 tarball → 打镜像 → 推单架构 tag
  # ============================================================
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # architecture=all 跑两个;选单架构时只跑匹配的那个
    if: ${{ github.event.inputs.architecture == 'all' || github.event.inputs.architecture == matrix.arch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup

      # 从 GitHub Release 下载对应架构的 tarball(公开仓库,免鉴权)
      # wget 不支持 glob,故先用 Release API 拿精确 asset 名,再 wget
      - name: Download Tarball from Release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          PXB_VERSION="${{ github.event.inputs.PXB_VERSION }}"
          GLIB_VERSION="${{ github.event.inputs.glib_version }}"
          TAG="v${PXB_VERSION}-glib${GLIB_VERSION}"
          REPO="${{ github.repository }}"

          # 架构 -> 文件名子串(tarball 由 pxb-build-binary.sh 用 uname -m 命名)
          case "${ARCH}" in
            amd64) ARCH_SUBSTR="Linux-x86_64" ;;
            arm64) ARCH_SUBSTR="Linux-aarch64" ;;
          esac

          echo "============================================"
          echo "  从 Release 下载二进制"
          echo "============================================"
          echo "  Release tag: ${TAG}"
          echo "  架构子串:    ${ARCH_SUBSTR}"
          echo "============================================"

          # 查 Release assets(公开仓库免 token)。jq 按架构子串过滤出下载 URL
          API_URL="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
          echo ">>> 查询 Release assets..."
          ASSET_URL=$(curl -fsSL "${API_URL}" | jq -r ".assets[].browser_download_url" | grep "${ARCH_SUBSTR}" | head -1 || true)

          if [ -z "${ASSET_URL}" ]; then
            echo "❌ 未在 Release ${TAG} 找到含 '${ARCH_SUBSTR}' 的 tarball"
            echo "    可能原因:build-binary.yml 还没用此版本号跑过,或版本号/glibc 填错。"
            echo "    该 Release 现有 assets:"
            curl -fsSL "${API_URL}" | jq -r '.assets[].name' 2>/dev/null || echo "    (无法读取 Release)"
            exit 1
          fi

          echo ">>> 下载: ${ASSET_URL}"
          mkdir -p output
          wget -q -O "output/$(basename "${ASSET_URL}")" "${ASSET_URL}"
          ls -lh output/

      - name: Login ACR
        run: |
          docker login -u "${ALIYUN_REGISTRY_USER}" -p "${ALIYUN_REGISTRY_PASSWORD}" "${ALIYUN_REGISTRY}"
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_REGISTRY_USER: ${{ vars.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # 复用 ci-build-image.sh:从 output/ 找 tarball → 生成临时 Dockerfile → buildx --push
      - name: Build and Push Image (${{ matrix.arch }})
        run: bash build/ci-build-image.sh
        env:
          PXB_VERSION: ${{ github.event.inputs.PXB_VERSION }}
          GLIB_VERSION: ${{ github.event.inputs.glib_version }}
          ARCH: ${{ matrix.arch }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ vars.ALIYUN_NAME_SPACE }}

      - name: Cleanup
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

  # ============================================================
  # Job 2: 合并单架构 tag 为多架构 manifest(仅 architecture=all)
  # ============================================================
  merge-manifest:
    needs: [build-image]
    if: ${{ github.event.inputs.architecture == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge Multi-Arch Manifest
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ vars.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ vars.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          PXB_VERSION="${{ github.event.inputs.PXB_VERSION }}"
          GLIB_VERSION="${{ github.event.inputs.glib_version }}"
          REPO="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}"
          MULTI_TAG="${REPO}/xtrabackup:${PXB_VERSION}-glib${GLIB_VERSION}"
          AMD64_TAG="${REPO}/xtrabackup:${PXB_VERSION}-glib${GLIB_VERSION}-amd64"
          ARM64_TAG="${REPO}/xtrabackup:${PXB_VERSION}-glib${GLIB_VERSION}-arm64"

          echo "============================================"
          echo "  合并多架构 manifest"
          echo "============================================"
          echo "  ${AMD64_TAG}"
          echo "  ${ARM64_TAG}"
          echo "  -> ${MULTI_TAG}"
          echo "============================================"

          docker login -u "${ALIYUN_REGISTRY_USER}" -p "${ALIYUN_REGISTRY_PASSWORD}" "${ALIYUN_REGISTRY}"

          # 用 buildx imagetools 合并(不是 docker manifest create)。
          # 原因:buildx --push 推的单架构镜像也是 manifest list 格式,
          # docker manifest create 不接受 manifest list 作为输入(报 "is a manifest list")。
          # imagetools create 专门处理 manifest list,能正确合并多架构。
          docker buildx imagetools create -t "${MULTI_TAG}" "${AMD64_TAG}" "${ARM64_TAG}"

          echo "✅ 多架构镜像推送成功: ${MULTI_TAG}"
